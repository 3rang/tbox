[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbox"
dynamic = ["version"]
description = "Personal file archive over Telegram Saved Messages (front end)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tarang Patel" }]

# The front never touches tdjson: all Telegram work goes through the compiled
# C engine as JSON lines (see src/tbox/core.py). Dependencies get added one at
# a time, only when a chunk actually needs one.
dependencies = [
    "qrcode>=7.4",  # draws the login code in the terminal
]

# The desktop app needs a window toolkit; the command line does not, so it is
# an extra you opt into:  pip install -e "front[gui]"
[project.optional-dependencies]
gui = [
    "PySide6>=6.6",  # Qt: the window itself
]
pack = [
    "pyinstaller>=6.6",  # freezes the app into one .exe
    "pillow>=10",        # draws the app icon at build time only
]

[project.scripts]
tbox = "tbox.cli:main"

[project.gui-scripts]
tbox-gui = "tbox.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# The compiled engine and its DLLs are copied in by build.ps1, so a wheel is
# a complete app rather than a thin client that needs a compiler.
[tool.setuptools.package-data]
tbox = ["bin/*"]

[tool.setuptools.dynamic]
version = { attr = "tbox.__version__" }