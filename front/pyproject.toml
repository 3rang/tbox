[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbox"
dynamic = ["version"]
description = "Personal file archive over Telegram Saved Messages (front end)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tarang Patel" }]

# The front never touches tdjson: all Telegram work goes through the compiled
# C engine as JSON lines (see src/tbox/core.py). Dependencies get added one at
# a time, only when a chunk actually needs one.
dependencies = [
    "qrcode>=7.4",  # draws the login code in the terminal
]

[project.scripts]
tbox = "tbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tbox.__version__" }