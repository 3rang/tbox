#
# Build and test on every push and pull request, on all three desktop OSes.
# No Telegram account is needed: the unit tests drive a fake TDLib, and the
# smoke test only checks that the real libtdjson links and that an
# unauthenticated run says so. "Run workflow" additionally exercises the
# slow TDLib-from-source static build on Linux.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test (real libtdjson, no account)
        shell: bash
        run: |
          cmake --install build --config Release --prefix stage
          ./stage/bin/tbox --version
          export TBOX_HOME="$RUNNER_TEMP/tbox-home" TBOX_API_ID=1 TBOX_API_HASH=x
          set +e
          ./stage/bin/tbox send me hello
          rc=$?
          set -e
          test "$rc" -eq 3 || { echo "expected exit 3 (not logged in), got $rc"; exit 1; }

  from-source:
    name: tdlib from source (static)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gperf libssl-dev zlib1g-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTBOX_TDLIB_FROM_SOURCE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: One self-contained binary
        run: |
          ldd build/tbox | grep -q tdjson && { echo "still depends on libtdjson"; exit 1; }
          ./build/tbox --version
